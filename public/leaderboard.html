<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leaderboard — FYR social bingo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header>
    <h1>Live leaderboard</h1>
    <p>Updates automatically. Highest squares filled wins.</p>
  </header>
  <div id="board"></div>
</div>
<script>
async function load(){
  var res = await fetch("/api/leaderboard");
  var data = await res.json();
  var board = document.getElementById("board");
  board.innerHTML = "";
  data.forEach(function(p, i){
    var row = document.createElement("div");
    row.className = "board-row" + (i === 0 && p.filled > 1 ? " top" : "");
    row.innerHTML = "<span class='rank'>" + (i+1) + "</span><span class='name'>" + p.name + "</span><span class='score'>" + p.filled + " / 25</span>";
    board.appendChild(row);
  });
}
load();
setInterval(load, 4000);
</script>
</body>
</html>
