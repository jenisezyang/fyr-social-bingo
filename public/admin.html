<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — FYR social bingo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header>
    <h1>Admin</h1>
    <p>Click a player to see their full card and answers.</p>
  </header>
  <div id="gate">
    <input type="password" id="pw-input" placeholder="Admin password">
    <button class="primary" id="pw-btn">Enter</button>
  </div>
  <div id="board" style="display:none;"></div>
  <div id="detail" style="display:none;"></div>
  <div id="danger" style="display:none;">
    <h2 class="danger-title">Clear test data</h2>
    <p class="danger-note">Removes every player and every answer. Use this once
      after testing, before the first years start playing. This cannot be undone.</p>
    <button class="danger-btn" id="reset-btn">Delete all players</button>
  </div>
</div>
<script>
var adminPassword = "";

function authHeaders(){
  return { "x-admin-password": adminPassword, "Content-Type": "application/json" };
}

document.getElementById("pw-btn").addEventListener("click", enter);
document.getElementById("pw-input").addEventListener("keydown", function(e){
  if(e.key === "Enter") enter();
});

async function enter(){
  adminPassword = document.getElementById("pw-input").value;
  var res = await fetch("/api/admin/players", { headers: authHeaders() });
  if(!res.ok){
    alert("Wrong password");
    return;
  }
  document.getElementById("gate").style.display = "none";
  document.getElementById("board").style.display = "block";
  document.getElementById("danger").style.display = "block";
  renderBoard(await res.json());
  // Keep the list current while the page sits open during an event.
  setInterval(loadBoard, 5000);
}

// Called on a timer, so failures stay quiet — a dropped poll just means this
// refresh is skipped and the next one tries again.
async function loadBoard(){
  try {
    var res = await fetch("/api/admin/players", { headers: authHeaders() });
    if(!res.ok) return;
    renderBoard(await res.json());
  } catch (e) {
    /* offline or transient; the next poll will pick it up */
  }
}

function renderBoard(data){
  var board = document.getElementById("board");
  board.innerHTML = "";
  if(!data.length){
    board.innerHTML = "<p class='empty-board'>No players yet.</p>";
    return;
  }
  data.forEach(function(p, i){
    var row = document.createElement("div");
    row.className = "board-row clickable" + (i === 0 && p.filled > 1 ? " top" : "");
    row.innerHTML = "<span class='rank'>" + (i+1) + "</span>" +
      "<span class='name'></span>" +
      "<span class='score'>" + p.filled + " / 25</span>" +
      "<button class='row-delete' title='Delete this player'>&times;</button>";
    row.querySelector(".name").textContent = p.name;
    row.addEventListener("click", function(){ loadDetail(p.id); });
    row.querySelector(".row-delete").addEventListener("click", function(e){
      e.stopPropagation();
      deletePlayer(p.id, p.name);
    });
    board.appendChild(row);
  });
}

async function deletePlayer(id, name){
  if(!confirm("Delete " + name + " and all their answers?")) return;
  var res = await fetch("/api/admin/player/" + id, {
    method: "DELETE",
    headers: authHeaders()
  });
  if(!res.ok){ alert("Could not delete that player"); return; }
  document.getElementById("detail").style.display = "none";
  loadBoard();
}

document.getElementById("reset-btn").addEventListener("click", async function(){
  var typed = prompt("This deletes EVERY player and answer.\n\nType RESET to confirm:");
  if(typed !== "RESET") return;
  var res = await fetch("/api/admin/reset", {
    method: "POST",
    headers: authHeaders(),
    body: JSON.stringify({ confirm: "RESET" })
  });
  if(!res.ok){ alert("Reset failed"); return; }
  var data = await res.json();
  document.getElementById("detail").style.display = "none";
  alert("Cleared " + data.removed + " player(s). The board is empty.");
  loadBoard();
});

async function loadDetail(id){
  var res = await fetch("/api/admin/player/" + id, { headers: authHeaders() });
  if(!res.ok){ alert("Unauthorized"); return; }
  var data = await res.json();
  var detail = document.getElementById("detail");
  detail.style.display = "block";
  var html = "<h2 style='font-size:16px;margin:16px 0 8px;'>" + data.player.name + "'s card</h2>";
  html += "<div class='grid'>";
  for(var i=0;i<25;i++){
    if(i===12){
      html += "<div class='cell free'>FREE</div>";
    } else {
      var val = data.answers[i];
      html += "<div class='cell" + (val ? " filled" : "") + "'>";
      html += "<div class='prompt'>" + data.card[i] + "</div>";
      html += "<div class='name" + (val ? "" : " empty") + "'>" + (val || "not filled") + "</div>";
      html += "</div>";
    }
  }
  html += "</div>";
  detail.innerHTML = html;
}
</script>
</body>
</html>
